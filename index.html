<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Location Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .box {
      max-width: 650px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    .notice {
      text-align: center;
      color: #555;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 0;
      border-radius: 9px;
      background: #1877f2;
      color: white;
      font-size: 16px;
    }

    #map {
      height: 450px;
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      background: #eee;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>📍 Live Location</h1>

  <p class="notice">
    This page requests your device location only after
    you press the button and grant browser permission.
  </p>

  <button onclick="startLocation()">
    📍 Allow Live Location
  </button>

  <div id="status">
    Location sharing is not active.
  </div>

  <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;
let marker;
let accuracyCircle;
let watchID;

function startLocation() {

  if (!navigator.geolocation) {
    document.getElementById("status").innerText =
      "Geolocation is not supported by this browser.";
    return;
  }

  document.getElementById("status").innerText =
    "Requesting location permission...";

  watchID = navigator.geolocation.watchPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      document.getElementById("status").innerHTML =
        "📍 Live location active<br>" +
        "Latitude: " + lat.toFixed(6) + "<br>" +
        "Longitude: " + lon.toFixed(6) + "<br>" +
        "Accuracy: approximately " +
        Math.round(accuracy) + " meters";

      updateMap(lat, lon, accuracy);

    },

    function(error) {

      document.getElementById("status").innerText =
        "Location permission was denied or unavailable.";

    },

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000
    }
  );
}


function updateMap(lat, lon, accuracy) {

  if (!map) {

    map = L.map("map").setView([lat, lon], 18);

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution:
          "Tiles © Esri"
      }
    ).addTo(map);

    marker = L.marker([lat, lon])
      .addTo(map)
      .bindPopup("📍 Your current location")
      .openPopup();

    accuracyCircle = L.circle(
      [lat, lon],
      {
        radius: accuracy
      }
    ).addTo(map);

  } else {

    marker.setLatLng([lat, lon]);

    accuracyCircle.setLatLng([lat, lon]);
    accuracyCircle.setRadius(accuracy);

    map.setView([lat, lon], map.getZoom());

  }
}

</script>

</body>
</html>
