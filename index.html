<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Location Dashboard</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef1f4;
      color: #111;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
      margin-top: 5px;
    }

    .notice {
      text-align: center;
      color: #555;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #1877f2;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin: 8px 0 15px;
    }

    #map {
      height: 430px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .info {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 14px;
      line-height: 1.7;
      word-break: break-word;
    }

    .label {
      font-weight: bold;
    }

    #status {
      text-align: center;
      margin: 10px 0;
      font-weight: bold;
    }

    .live {
      color: green;
    }

    .error {
      color: #c00;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🛰️ Live Location</h1>

    <p class="notice">
      Press the button below to share this device's location.
      Your browser will ask for permission first.
    </p>

    <button onclick="startTracking()">
      📍 Allow Live Location
    </button>

    <div id="status">
      Location sharing is not active.
    </div>

    <div id="map"></div>

    <div class="info">

      <div>
        <span class="label">🌍 Country:</span>
        <span id="country">—</span>
      </div>

      <div>
        <span class="label">🏙️ City:</span>
        <span id="city">—</span>
      </div>

      <div>
        <span class="label">🛣️ Address:</span>
        <span id="address">—</span>
      </div>

      <div>
        <span class="label">📍 Latitude:</span>
        <span id="latitude">—</span>
      </div>

      <div>
        <span class="label">📍 Longitude:</span>
        <span id="longitude">—</span>
      </div>

      <div>
        <span class="label">🎯 Accuracy:</span>
        <span id="accuracy">—</span>
      </div>

      <div>
        <span class="label">🕐 Last update:</span>
        <span id="timestamp">—</span>
      </div>

    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map = null;
let marker = null;
let accuracyCircle = null;
let watchId = null;

let lastGeocodeTime = 0;

function startTracking() {

  if (!navigator.geolocation) {

    setStatus(
      "This browser does not support location.",
      true
    );

    return;
  }

  setStatus(
    "Requesting location permission..."
  );

  watchId = navigator.geolocation.watchPosition(

    position => {

      updateLocation(position);

    },

    error => {

      setStatus(
        "Location permission was denied or unavailable.",
        true
      );

    },

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );
}


function updateLocation(position) {

  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  const accuracy = position.coords.accuracy;

  document.getElementById("latitude").textContent =
    lat.toFixed(6);

  document.getElementById("longitude").textContent =
    lon.toFixed(6);

  document.getElementById("accuracy").textContent =
    "approximately " +
    Math.round(accuracy) +
    " meters";

  const now = new Date();

  document.getElementById("timestamp").textContent =
    now.toLocaleString();

  setStatus(
    "● Live location active",
    false
  );

  updateMap(lat, lon, accuracy);

  /*
    Avoid repeatedly requesting the address.
    Reverse geocoding is performed at most once every 10 seconds.
  */

  const currentTime = Date.now();

  if (currentTime - lastGeocodeTime > 10000) {

    lastGeocodeTime = currentTime;

    reverseGeocode(lat, lon);
  }
}


function updateMap(lat, lon, accuracy) {

  if (!map) {

    map = L.map("map").setView(
      [lat, lon],
      18
    );

    /*
      Satellite imagery.
    */

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution: "© Esri"
      }
    ).addTo(map);

    marker = L.marker(
      [lat, lon]
    ).addTo(map);

    marker.bindPopup(
      "📍 Current device location"
    );

    accuracyCircle = L.circle(
      [lat, lon],
      {
        radius: accuracy
      }
    ).addTo(map);

  } else {

    marker.setLatLng(
      [lat, lon]
    );

    accuracyCircle.setLatLng(
      [lat, lon]
    );

    accuracyCircle.setRadius(
      accuracy
    );

    map.setView(
      [lat, lon],
      map.getZoom()
    );
  }
}


async function reverseGeocode(lat, lon) {

  document.getElementById("address").textContent =
    "Looking up address...";

  try {

    const url =
      "https://nominatim.openstreetmap.org/reverse" +
      "?format=jsonv2" +
      "&lat=" + encodeURIComponent(lat) +
      "&lon=" + encodeURIComponent(lon) +
      "&zoom=18" +
      "&addressdetails=1";

    const response = await fetch(url, {
      headers: {
        "Accept": "application/json"
      }
    });

    if (!response.ok) {
      throw new Error("Geocoding request failed");
    }

    const data = await response.json();

    const a = data.address || {};

    document.getElementById("country").textContent =
      a.country || "Unavailable";

    document.getElementById("city").textContent =
      a.city ||
      a.town ||
      a.municipality ||
      a.village ||
      a.suburb ||
      "Unavailable";

    document.getElementById("address").textContent =
      data.display_name ||
      "Address unavailable";

  } catch (error) {

    document.getElementById("address").textContent =
      "Address lookup unavailable";

  }
}


function setStatus(message, isError = false) {

  const status =
    document.getElementById("status");

  status.textContent = message;

  status.className =
    isError ? "error" : "live";
}

</script>

</body>
</html>
